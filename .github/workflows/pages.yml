name: Deploy Pocket Aquarium 3D app to GitHub Pages

# Builds and deploys the Three.js / React (realistic_light_transport) app — the main
# Pocket Aquarium product. Vite bundles the authoritative root simulation (js/data.js,
# js/sim.js) and required assets into a self-contained artifact. The asset workbench stays
# reachable on the same build via the ?workbench= query. Docs, labs, tests and repo
# metadata are never published.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions for an OIDC-based Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One production deployment at a time; never cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: realistic_light_transport/package-lock.json

      - name: Install dependencies
        working-directory: realistic_light_transport
        run: npm ci

      - name: Build the 3D Pocket Aquarium app
        working-directory: realistic_light_transport
        run: npm run build

      - name: Stage built artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mv realistic_light_transport/dist _site
          echo "Staged artifact contents:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
