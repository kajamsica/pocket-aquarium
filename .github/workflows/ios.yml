name: Validate native mobile hosts

on:
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "native/**"
      - "realistic_light_transport/**"
      - "tests/native.test.js"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "js/**"
      - "assets/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "native/**"
      - "realistic_light_transport/**"
      - "tests/native.test.js"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "js/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('native-mobile-testflight-{0}', github.ref) || format('native-mobile-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build unsigned iOS simulator app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            native/package-lock.json
            realistic_light_transport/package-lock.json

      - name: Install 3D app dependencies
        working-directory: realistic_light_transport
        run: npm ci

      - name: Build the accepted 3D web runtime
        working-directory: realistic_light_transport
        run: npm run build

      - name: Install pinned Capacitor toolchain
        working-directory: native
        run: npm ci

      - name: Stage and sync the accepted web runtime
        working-directory: native
        run: npm run sync

      - name: Run native packaging contracts
        run: node tests/native.test.js

      - name: Record Xcode toolchain
        run: xcodebuild -version

      - name: Build without signing for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project native/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath native/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package the simulator app
        run: ditto -c -k --sequesterRsrc --keepParent native/DerivedData/Build/Products/Debug-iphonesimulator/App.app PocketAquarium-Simulator.app.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: PocketAquarium-iOS-Simulator
          path: PocketAquarium-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            native/package-lock.json
            realistic_light_transport/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install 3D app dependencies
        working-directory: realistic_light_transport
        run: npm ci

      - name: Build the accepted 3D web runtime
        working-directory: realistic_light_transport
        run: npm run build

      - name: Install pinned Capacitor toolchain
        working-directory: native
        run: npm ci

      - name: Stage and sync the accepted web runtime
        working-directory: native
        run: npm run sync:android

      - name: Run native packaging contracts
        run: node tests/native.test.js

      - name: Build the debug APK
        working-directory: native/android
        run: ./gradlew :app:assembleDebug

      - name: Upload the installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketAquarium-Android-Debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  testflight:
    name: Upload signed iOS app to TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: macos-26
    timeout-minutes: 30
    environment: apple-testflight

    steps:
      - name: Require protected TestFlight inputs
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_APP_STORE_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing protected input: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            native/package-lock.json
            realistic_light_transport/package-lock.json

      - name: Install 3D app dependencies
        working-directory: realistic_light_transport
        run: npm ci

      - name: Build the accepted 3D web runtime
        working-directory: realistic_light_transport
        run: npm run build

      - name: Install pinned Capacitor toolchain
        working-directory: native
        run: npm ci

      - name: Stage and sync the accepted web runtime
        working-directory: native
        run: npm run sync

      - name: Run native packaging contracts
        run: node tests/native.test.js

      - name: Record Xcode toolchain
        run: xcodebuild -version

      - name: Install ephemeral signing credentials
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          credentials="$RUNNER_TEMP/pocket-aquarium-testflight-credentials"
          keychain="$RUNNER_TEMP/pocket-aquarium-testflight.keychain-db"
          release="$RUNNER_TEMP/pocket-aquarium-ios-release"
          mkdir -p "$credentials" "$release"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$credentials/distribution.p12"
          printf '%s' "$IOS_APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$credentials/app-store.mobileprovision"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$credentials/AuthKey.p8"

          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$credentials/distribution.p12" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"

          security cms -D -i "$credentials/app-store.mobileprovision" > "$credentials/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$credentials/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$credentials/profile.plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$credentials/profile.plist")"
          profile_app="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$credentials/profile.plist")"
          echo "::add-mask::$profile_uuid"
          echo "::add-mask::$profile_name"
          [[ "$profile_team" == "$APPLE_TEAM_ID" ]] || { echo "::error::Provisioning profile team does not match APPLE_TEAM_ID"; exit 1; }
          [[ "$profile_app" == "$APPLE_TEAM_ID.com.kajamsica.pocketaquarium" ]] || { echo "::error::Provisioning profile does not match com.kajamsica.pocketaquarium"; exit 1; }

          profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          api_key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          {
            echo "IOS_PROFILE_UUID=$profile_uuid"
            echo "IOS_PROFILE_NAME=$profile_name"
            echo "IOS_PROFILE_PATH=$profile_path"
            echo "IOS_API_KEY_PATH=$api_key_path"
            echo "IOS_RELEASE_ROOT=$release"
          } >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$profile_path")" "$(dirname "$api_key_path")"
          install -m 600 "$credentials/app-store.mobileprovision" "$profile_path"
          install -m 600 "$credentials/AuthKey.p8" "$api_key_path"

      - name: Archive and export the App Store build
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          archive="$IOS_RELEASE_ROOT/PocketAquarium.xcarchive"
          export_path="$IOS_RELEASE_ROOT/export"
          export_options="$IOS_RELEASE_ROOT/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.kajamsica.pocketaquarium</key><string>$IOS_PROFILE_UUID</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild \
            -project native/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.kajamsica.pocketaquarium \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive
          xcodebuild -exportArchive -archivePath "$archive" -exportPath "$export_path" -exportOptionsPlist "$export_options"
          ipa="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$ipa" ]] || { echo "::error::No IPA was exported"; exit 1; }
          echo "IOS_IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Validate and upload to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app --type ios --file "$IOS_IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IOS_IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove signing credentials and release outputs
        if: always()
        shell: bash
        run: |
          if [[ -n "${IOS_PROFILE_PATH:-}" ]]; then rm -f "$IOS_PROFILE_PATH"; fi
          if [[ -n "${IOS_API_KEY_PATH:-}" ]]; then rm -f "$IOS_API_KEY_PATH"; fi
          security delete-keychain "$RUNNER_TEMP/pocket-aquarium-testflight.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/pocket-aquarium-testflight-credentials" "$RUNNER_TEMP/pocket-aquarium-ios-release"
