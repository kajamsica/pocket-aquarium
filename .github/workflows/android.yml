name: Build installable Android debug APK

on:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "native/**"
      - "realistic_light_transport/**"
      - "tests/native.test.js"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "js/**"
      - "assets/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "native/**"
      - "realistic_light_transport/**"
      - "tests/native.test.js"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "js/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            native/package-lock.json
            realistic_light_transport/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install 3D app dependencies
        working-directory: realistic_light_transport
        run: npm ci

      - name: Build the accepted 3D web runtime
        working-directory: realistic_light_transport
        run: npm run build

      - name: Install pinned Capacitor toolchain
        working-directory: native
        run: npm ci

      - name: Stage and sync the accepted web runtime
        working-directory: native
        run: npm run sync:android

      - name: Run native packaging contracts
        run: node tests/native.test.js

      - name: Build the debug APK
        working-directory: native/android
        run: ./gradlew :app:assembleDebug

      - name: Upload the installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketAquarium-Android-Debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
